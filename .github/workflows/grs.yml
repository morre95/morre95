name: Update README cards
run-name: Update README cards (safe push @ ${{ github.sha }})

on:
  schedule:
    - cron: "0 0 1 * *" # Runs once first day of month at midnight
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grs.yml'

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      discussions: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_progress=true
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Validate generated cards
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          cards = [
              "stats.svg",
              "top-langs.svg",
              "pin-readme-tools-github-readme-stats.svg",
          ]
          errors = []
          for name in cards:
              path = Path("profile") / name
              try:
                  root = ET.parse(path).getroot()
                  if root.tag != "{http://www.w3.org/2000/svg}svg":
                      raise ValueError("Not an SVG document")
                  text = " ".join(root.itertext())
                  if any(message in text for message in (
                      "Something went wrong", "Resource not accessible",
                      "Could not resolve", "Repository Not found",
                  )):
                      raise ValueError(text)
              except (OSError, ET.ParseError, ValueError) as error:
                  errors.append(f"{path}: {error}")
          if errors:
              raise SystemExit("\n".join(errors))

      - name: Commit and push cards safely
        run: |
          git config user.name "morre95"
          git config user.email "erik.moren78@gmail.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "README cards are already up to date."
            exit 0
          fi
          git commit -m "Update README cards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
