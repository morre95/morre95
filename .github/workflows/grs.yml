name: Update README cards

on:
  schedule:
    - cron: "0 0 1 * *" # Runs once first day of month at midnight
  workflow_dispatch:

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      discussions: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_progress=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=readme-tools&repo=github-readme-stats
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate wakaTime card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: wakatime
          options: username=${{ github.repository_owner }}&layout=compact
          path: profile/waka-time-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated cards
        run: |
          if grep -El "Something went wrong|Resource not accessible|Could not resolve" \
            profile/stats.svg profile/top-langs.svg \
            profile/pin-readme-tools-github-readme-stats.svg \
            profile/waka-time-stats.svg; then
            echo "One or more README cards contain an error response."
            exit 1
          fi

      - name: Commit and push cards safely
        run: |
          git config user.name "morre95"
          git config user.email "erik.moren78@gmail.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "README cards are already up to date."
            exit 0
          fi
          git commit -m "Update README cards"

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"

            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying after syncing again."
            sleep $((attempt * 5))
          done

          echo "Unable to push README cards after three attempts."
          exit 1
